$font = JetBrainsMono Nerd Font
$wallpaper = /home/ncho/.local/share/backgrounds/hyprland-neon.png

general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = smooth, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, smooth
    animation = fadeOut, 1, 2, smooth
    animation = inputFieldDots, 1, 2, smooth
}

background {
    monitor =
    path = $wallpaper
    blur_passes = 2
    blur_size = 6
    brightness = 0.56
    contrast = 0.95
    vibrancy = 0.18
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 2
    inner_color = rgba(111827cc)
    outer_color = rgba(33ccffee) rgba(cba6f7ee) 45deg
    check_color = rgba(00ff99ee) rgba(33ccffee) 120deg
    fail_color = rgba(f38ba8ee) rgba(f9e2afee) 45deg
    font_color = rgb(cdd6f4)
    fade_on_empty = false
    rounding = 14
    dots_spacing = 0.25
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, -30
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 86
    font_family = $font
    color = rgb(cdd6f4)
    position = 0, 145
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgb(89dceb)
    position = 0, 88
    halign = center
    valign = center
}
