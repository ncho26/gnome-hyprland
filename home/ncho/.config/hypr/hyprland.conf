# Hyprland session for ncho.
# Starts a complete Wayland desktop while keeping tty login password-gated.

autogenerated = 0

$mainMod = SUPER
$terminal = kitty
$fileManager = nautilus
$menu = vicinae toggle

monitor = DP-1, 3840x2160@170.07, 0x0, 1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = DESKTOP_SESSION,hyprland
env = DCONF_PROFILE,/home/ncho/.config/dconf/profile/hyprland
env = GDK_BACKEND,wayland,x11
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = SDL_VIDEODRIVER,wayland
env = CLUTTER_BACKEND,wayland
env = XCURSOR_THEME,Adwaita
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_IM_MODULE,fcitx
env = GTK_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
env = SDL_IM_MODULE,fcitx
env = GLFW_IM_MODULE,ibus
env = LIBVA_DRIVER_NAME,nvidia
env = NVD_BACKEND,direct
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_DESKTOP XDG_SESSION_TYPE DESKTOP_SESSION DCONF_PROFILE QT_IM_MODULE GTK_IM_MODULE XMODIFIERS SDL_IM_MODULE GLFW_IM_MODULE LIBVA_DRIVER_NAME NVD_BACKEND __GLX_VENDOR_LIBRARY_NAME
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = fcitx5 -d --replace
exec-once = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = gsettings set org.gnome.desktop.interface gtk-theme Adwaita-dark
exec-once = gsettings set org.gnome.desktop.interface icon-theme Papirus-Dark
exec-once = vicinae server
exec-once = /home/ncho/.local/bin/hypr-wallpaper-engine
exec-once = caelestia shell -d
exec-once = qs -c specialapps -d
# Replaced by Caelestia's left bar/dashboard layer. The files are still backed up.
# exec-once = waybar
# exec-once = /home/ncho/.local/bin/hypr-taskbar
exec-once = swaync
exec-once = sh -c 'wl-paste --type text --watch cliphist store & wl-paste --type image --watch cliphist store &'

input {
    kb_layout = us
    kb_options = korean:ralt_hangul,korean:rctrl_hanja
    numlock_by_default = true
    follow_mouse = 0
    mouse_refocus = false
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

general {
    gaps_in = 5
    gaps_out = 14
    border_size = 2
    resize_on_border = true
    allow_tearing = false
    layout = dwindle

    col.active_border = rgba(33ccffee) rgba(cba6f7ee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(313244aa)
}

decoration {
    rounding = 10
    rounding_power = 2
    active_opacity = 0.98
    inactive_opacity = 0.92
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 24
        render_power = 4
        color = rgba(00000055)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.20
        popups = true
    }
}

animations {
    enabled = true
    workspace_wraparound = true
}

bezier = hyprOut, 0.23, 1, 0.32, 1
bezier = hyprInOut, 0.65, 0.05, 0.36, 1
bezier = quick, 0.15, 0, 0.1, 1
bezier = almostLinear, 0.5, 0.5, 0.75, 1

animation = windows, 1, 4.8, hyprOut, popin 87%
animation = windowsOut, 1, 1.5, quick, popin 87%
animation = border, 1, 5.4, hyprOut
animation = fade, 1, 3.0, quick
animation = layers, 1, 3.8, hyprOut, fade
animation = workspaces, 1, 2.0, almostLinear, fade
animation = specialWorkspace, 1, 3.2, hyprOut, slidefade 18%

dwindle {
    force_split = 0
    preserve_split = true
    smart_split = false
    split_width_multiplier = 1.0
}

master {
    new_status = master
}

gestures {
    workspace_swipe_touch = true
    workspace_swipe_distance = 300
    workspace_swipe_create_new = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
    animate_manual_resizes = true
    disable_splash_rendering = true
    mouse_move_focuses_monitor = false
}

layerrule = blur on, match:namespace waybar
layerrule = blur on, match:namespace launcher
layerrule = blur on, match:namespace notifications
layerrule = blur on, match:namespace control-center
layerrule = blur on, match:namespace specialapps
layerrule = ignore_alpha 0.2, match:namespace launcher
layerrule = ignore_alpha 0.2, match:namespace specialapps

windowrule = suppress_event maximize, match:class .*
windowrule = float true, match:class ^(Rofi)$
windowrule = center true, match:class ^(Rofi)$
windowrule = border_size 0, match:class ^(Rofi)$
windowrule = float true, match:class ^(pavucontrol)$
windowrule = center true, match:class ^(pavucontrol)$
windowrule = opacity 0.95 0.90, match:class ^(kitty)$
windowrule = opacity 0.96 0.90, match:class ^(obsidian)$

bind = SUPER, Y, exec, gtk-launch youtube
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, /home/ncho/.local/bin/wayland-exit-menu
bind = $mainMod SHIFT, M, exec, /home/ncho/.local/bin/wayland-exit-menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, R, exec, $menu
bindr = $mainMod, SUPER_L, exec, $menu
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod, I, exec, /home/ncho/.local/bin/hypr-island toggle
bind = $mainMod SHIFT, I, exec, /home/ncho/.local/bin/hypr-island minimize
bind = $mainMod, Space, submap, move_window_to_workspace

bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, Page_Up, workspace, -1
bind = $mainMod, Page_Down, workspace, +1
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

submap = move_window_to_workspace
bind = , 1, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 1; hyprctl dispatch submap reset'
bind = , 2, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 2; hyprctl dispatch submap reset'
bind = , 3, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 3; hyprctl dispatch submap reset'
bind = , 4, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 4; hyprctl dispatch submap reset'
bind = , 5, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 5; hyprctl dispatch submap reset'
bind = , 6, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 6; hyprctl dispatch submap reset'
bind = , 7, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 7; hyprctl dispatch submap reset'
bind = , 8, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 8; hyprctl dispatch submap reset'
bind = , 9, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 9; hyprctl dispatch submap reset'
bind = , 0, exec, sh -c 'hyprctl dispatch movetoworkspacesilent 10; hyprctl dispatch submap reset'
bind = , S, exec, sh -c '/home/ncho/.local/bin/hypr-island minimize; hyprctl dispatch submap reset'
bind = , Escape, submap, reset
submap = reset

bind = $mainMod, S, togglespecialworkspace, scratch
bind = $mainMod SHIFT, S, exec, /home/ncho/.local/bin/hypr-island minimize
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

bind = , Print, exec, grim -g "$(slurp)" - | wl-copy -t image/png
bind = SHIFT, Print, exec, grim - | wl-copy -t image/png
bind = CTRL, Print, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%F-%H%M%S).png"'
bind = CTRL SHIFT, Print, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim "$HOME/Pictures/Screenshots/$(date +%F-%H%M%S).png"'

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
